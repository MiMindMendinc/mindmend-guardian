[project]
name = "mindmend-guardian"
version = "0.3.0"
description = "Privacy-first youth safety and wellness support prototype from Michigan MindMend Inc."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Lyle Perrien II", email = "michiganmindmendinc@proton.me" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Typing :: Typed",
]
keywords = [
  "ai-safety",
  "offline-ai",
  "privacy",
  "youth-safety",
  "mental-wellness",
  "local-first"
]
dependencies = []

[project.optional-dependencies]
core = []
api = [
  "Flask>=3.0,<4",
  "PyJWT>=2.12",
  "firebase-admin>=6.0",
  "spacy>=3.7,<4",
  "spacytextblob>=4.0",
]
luna = [
  "Flask>=3.0,<4",
  "PyJWT>=2.12",
  "firebase-admin>=6.0",
  "spacy>=3.7,<4",
  "spacytextblob>=4.0",
]
voice = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.16",
  "psutil>=5.9",
  "pyaudio>=0.2.14",
  "pyttsx3>=2.90",
  "torch>=2.1",
]
simulator = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "plotly>=5.18",
  "streamlit>=1.30",
]
dev = [
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.8",
]
all = [
  "Flask>=3.0,<4",
  "PyJWT>=2.12",
  "firebase-admin>=6.0",
  "spacy>=3.7,<4",
  "spacytextblob>=4.0",
  "numpy>=1.26,<3",
  "onnxruntime>=1.16",
  "psutil>=5.9",
  "pyaudio>=0.2.14",
  "pyttsx3>=2.90",
  "torch>=2.1",
  "pandas>=2.1,<4",
  "plotly>=5.18",
  "streamlit>=1.30",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.8",
]

[project.scripts]
mindmend-demo = "guardian.demo.cli:main"

[project.urls]
Homepage = "https://github.com/MiMindMendinc/mindmend-guardian"
Repository = "https://github.com/MiMindMendinc/mindmend-guardian"
Documentation = "https://github.com/MiMindMendinc/mindmend-guardian/tree/main/docs"
Changelog = "https://github.com/MiMindMendinc/mindmend-guardian/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/MiMindMendinc/mindmend-guardian/issues"
"Source Code" = "https://github.com/MiMindMendinc/mindmend-guardian"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["guardian"]
branch = true
omit = [
  "guardian/mindmend_guardian.py",
  "guardian/dashboard/*",
  "guardian/luna/luna_safety_core.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["guardian", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"guardian/mindmend_guardian.py" = ["E501"]
"guardian/core.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
