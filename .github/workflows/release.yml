name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "Flask>=3.0,<4" "PyJWT>=2.12"

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          export TAG
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["TAG"]
          pyproject = pathlib.Path("pyproject.toml").read_text()
          init = pathlib.Path("guardian/__init__.py").read_text()
          pv = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          iv = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if pv != tag or iv != tag:
              print(f"Version mismatch: tag={tag} pyproject={pv} __init__={iv}")
              sys.exit(1)
          print(f"Version {tag} matches pyproject.toml and guardian/__init__.py")
          PY

      - name: Lint
        run: ruff check guardian tests

      - name: Run tests with coverage
        run: pytest --cov=guardian --cov-report=term-missing

      - name: Verify demo command
        run: python -m guardian.demo --json
