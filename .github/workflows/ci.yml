name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "Flask>=3.0,<4" "PyJWT>=2.12"

      - name: Lint
        run: ruff check guardian tests

      - name: Format check
        run: ruff format --check guardian tests

      - name: Secret pattern scan
        run: |
          set -euo pipefail
          if grep -RInE "(SECRET_KEY[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]|serviceAccountKey\.json|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})" guardian tests --include='*.py' ; then
            echo "Potential hard-coded secret pattern found."
            exit 1
          fi
          echo "No obvious hard-coded secret patterns found."

      - name: Dependency audit
        run: pip-audit -r <(pip freeze)

      - name: Run tests with coverage
        run: pytest --cov=guardian --cov-report=term-missing

      - name: Verify local demo command
        run: python -m guardian.demo --json
